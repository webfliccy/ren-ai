task: >
  Optimize ren-ai Next.js 16 blog for component reuse with shared styles and
  modules. Metric: total JS chunk size (KB) from .next/static/chunks/, minimize.
  Scope: extract shared Tailwind class strings to src/lib/styles.ts, consolidate
  duplicated utility functions (slugify, parseTags) into src/lib/, unify CSS
  custom properties. Edit src/components/ and src/lib/ only; do not touch db/,
  auth, or public/uploads/.

coordinator:
  max_cycles: 3
  trunk_branch: arbor
  ui:
    interaction_mode: collaborative

eval:
  cmd: "cd {cwd} && bash eval.sh"
  metric: total_js_kb
  direction: minimize
  baseline: 1372

budget:
  max_cycles: 3
  ask_before: [package_install, b_test, training]
